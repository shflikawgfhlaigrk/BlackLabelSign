name = "bl-sign"
main = "src/index.js"
compatibility_date = "2026-07-30"
account_id = "a0703c8cbbf2d56af47d05d5817b8c5b"
workers_dev = false
routes = [
  { pattern = "sign.blacklabeltec.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "bl-sign"
database_id = "da4face0-64be-41f5-be38-9efb6576e013"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "bl-sign-docs"

[observability]
enabled = true

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["sign@blacklabelbots.com"]

[triggers]
crons = ["17 * * * *"]
